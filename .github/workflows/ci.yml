# CI: checks HTML whenever code is pushed or a pull request is opened
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets deploy.yml run these checks before publishing
  workflow_call:

jobs:
  html-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML validator
        run: npm install --no-save html-validate

      - name: Validate HTML files
        run: npx html-validate "index.html" "pages/*.html"
